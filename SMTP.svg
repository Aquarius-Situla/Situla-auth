<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <clipPath id="envelope-clip">
      <!-- Outer boundary of the envelope stroke: x-8, y-8, w+16, h+16, rx+8 -->
      <rect x="16" y="48" width="224" height="160" rx="24" ry="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#envelope-clip)">
    <!-- Box -->
    <rect x="24" y="56" width="208" height="144" rx="16" ry="16" fill="none" stroke="#000000" stroke-width="16" />
    
    <!-- Flap (V shape). We make it start slightly outside so the clip perfectly trims it to the rounded corner! -->
    <!-- Start at x=16, y=48 (top left outer corner), go to center, then x=240, y=48 -->
    <polyline points="16,48 128,136 240,48" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>