<!DOCTYPE html>
<html lang="zh-CN" class="login-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@simplewebauthn/browser@9.0.1/dist/bundle/index.umd.min.js"></script>
</head>
<body class="login-page">

    <!-- Top gray bar with nav -->
    <div class="gray-top-bar">
        <div class="nav-content">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <span class="nav-title">登录</span>
        </div>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <div class="apple-container">
            <div class="logo-container">
                <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor" style="margin-bottom:12px;">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <h1>登录</h1>
                <p id="subtitle">管理你的账户</p>
                <script>
                    // Hide subtitle when used as forward auth (rd param present)
                    if (new URLSearchParams(window.location.search).get('rd')) {
                        document.getElementById('subtitle').style.display = 'none';
                    }
                </script>
            </div>

            <form id="loginForm">
                <!-- Unified input card: username + divider + password -->
                <div class="input-card" id="inputCard">
                    <div class="input-group" id="usernameGroup">
                        <input type="text" id="username" placeholder="用户名" required autocomplete="username">
                    </div>

                    <!-- Divider (hidden until password revealed) -->
                    <div class="input-divider-wrap" id="dividerWrap">
                        <div class="input-divider"></div>
                    </div>

                    <!-- Password (hidden initially) -->
                    <div class="input-group reveal-group" id="passwordGroup">
                        <input type="password" id="password" placeholder="密码" autocomplete="current-password">
                    </div>
                </div>

                <div id="errorMessage" class="error-message"></div>

                <div class="button-row">
                    <button type="submit" class="login-btn btn-primary" id="submitBtn">继续</button>
                    <div class="or-divider">or</div>
                    <button type="button" class="login-btn passkey-btn" id="passkeyBtn">
                        <img src="/passkey.svg" width="18" height="18"
                             alt="Passkey"
                             style="margin-right:7px; flex-shrink:0; vertical-align:middle; object-fit:contain;">
                        通过通行密钥登录
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bottom gray bar (mobile) -->
    <div class="gray-bottom-bar"></div>

    <script>
        const { startAuthentication } = SimpleWebAuthnBrowser;
        let step = 1;

        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const pwdGroup = document.getElementById('passwordGroup');
        const dividerWrap = document.getElementById('dividerWrap');
        const inputCard = document.getElementById('inputCard');
        const errMsg = document.getElementById('errorMessage');

        // Unified focus ring on the card
        [usernameInput, passwordInput].forEach(input => {
            input.addEventListener('focus', () => inputCard.classList.add('focused'));
            input.addEventListener('blur', () => inputCard.classList.remove('focused'));
        });

        // Blue button only when username has text
        function updateButtonState() {
            if (usernameInput.value.trim()) {
                submitBtn.classList.add('active');
            } else {
                submitBtn.classList.remove('active');
            }
        }
        usernameInput.addEventListener('input', updateButtonState);

        // Form submit handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const u = usernameInput.value.trim();
            const p = passwordInput.value;
            errMsg.textContent = '';

            /* Step 1: Reveal password field with animation */
            if (step === 1) {
                if (!u) return;

                // Mark username input as "top" (square bottom corners)
                usernameInput.classList.add('top-input');

                // Reveal divider + password with slide-down animation
                dividerWrap.classList.add('show');
                // Trigger reflow so transition fires
                pwdGroup.getBoundingClientRect();
                pwdGroup.classList.add('show');

                setTimeout(() => passwordInput.focus(), 350);
                step = 2;
                return;
            }

            /* Step 2: Attempt login */
            if (step === 2 && !p) return;

            submitBtn.textContent = '验证中...';
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: u, password: p, totp: '' })
                });

                const data = await res.json();

                if (data.requireTotp) {
                    // Navigate to TOTP page
                    sessionStorage.setItem('username', u);
                    sessionStorage.setItem('password', p);
                    window.location.href = '/totp.html';
                    return;
                }

                if (data.success) {
                    const urlParams = new URLSearchParams(window.location.search);
                    const rd = urlParams.get('rd');
                    setTimeout(() => {
                        window.location.href = (rd && rd.startsWith('http')) ? rd : '/admin';
                    }, 300);
                } else {
                    errMsg.textContent = data.message || '用户名或密码错误';
                    submitBtn.textContent = '继续';
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            } catch (err) {
                errMsg.textContent = '网络错误，请重试';
                submitBtn.textContent = '继续';
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });

        // Passkey button
        document.getElementById('passkeyBtn').addEventListener('click', async () => {
            errMsg.textContent = '';
            try {
                const resp = await fetch('/api/webauthn/login-options');
                if (!resp.ok) throw new Error('未检测到可用的通行密钥');
                const options = await resp.json();

                const asseResp = await startAuthentication(options);

                const verificationResp = await fetch('/api/webauthn/login-verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(asseResp)
                });

                const verificationJSON = await verificationResp.json();
                if (verificationJSON && verificationJSON.verified) {
                    const urlParams = new URLSearchParams(window.location.search);
                    const rd = urlParams.get('rd');
                    window.location.href = (rd && rd.startsWith('http')) ? rd : '/admin';
                } else {
                    errMsg.textContent = '通行密钥验证失败';
                }
            } catch (error) {
                errMsg.textContent = error.message || '通行密钥取消或验证失败';
            }
        });
    </script>
</body>
</html>
