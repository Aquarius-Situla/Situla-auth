<!DOCTYPE html>
<html lang="zh-CN" class="login-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="身份验证">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>登录</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@simplewebauthn/browser@9.0.1/dist/bundle/index.umd.min.js"></script>
    <script src="i18n.js"></script>
</head>
<body class="login-page" data-page-title-key="login_doc_title">

    <!-- Top gray bar with nav -->
    <div class="gray-top-bar">
        <div class="nav-content">
            <img src="/user.svg" width="18" height="18" alt="User" class="user-icon">
            <span class="nav-title" data-i18n="login_title">登录</span>
        </div>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <div class="apple-container">
            <div class="logo-container">
                <img src="/user.svg" width="48" height="48" style="margin-bottom:12px;" alt="User" class="user-icon">
                <h1 data-i18n="login_title">登录</h1>
                <p id="subtitle" data-i18n="login_subtitle">管理你的账户</p>
                <script>
                    // Hide subtitle when used as forward auth (rd param present)
                    if (new URLSearchParams(window.location.search).get('rd')) {
                        document.getElementById('subtitle').style.display = 'none';
                    }
                </script>
            </div>

            <form id="loginForm">
                <!-- Unified input card: username + divider + password -->
                <div class="input-card" id="inputCard">
                    <div class="input-group" id="usernameGroup">
                        <input type="text" id="username" data-i18n-placeholder="username_placeholder" placeholder="用户名" required autocomplete="username">
                    </div>

                    <!-- Divider (hidden until password revealed) -->
                    <div class="input-divider-wrap" id="dividerWrap">
                        <div class="input-divider"></div>
                    </div>

                    <!-- Password (hidden initially) -->
                    <div class="input-group reveal-group" id="passwordGroup">
                        <input type="password" id="password" data-i18n-placeholder="password_placeholder" placeholder="密码" autocomplete="current-password">
                    </div>
                </div>

                <div id="errorMessage" class="error-message"></div>

                <div class="button-row">
                    <button type="submit" class="login-btn btn-primary" id="submitBtn" data-i18n="btn_continue">继续</button>
                    <div class="or-divider" data-i18n="or_divider">or</div>
                    <button type="button" class="login-btn passkey-btn" id="passkeyBtn">
                        <img src="/passkey.svg" width="18" height="18"
                             alt="Passkey"
                             style="margin-right:7px; flex-shrink:0; vertical-align:middle; object-fit:contain;">
                        <span data-i18n="btn_passkey">通过通行密钥登录</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bottom gray bar (mobile) -->
    <div class="gray-bottom-bar"></div>

    <script>
        const { startAuthentication } = SimpleWebAuthnBrowser;
        let step = 1;

        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const pwdGroup = document.getElementById('passwordGroup');
        const dividerWrap = document.getElementById('dividerWrap');
        const inputCard = document.getElementById('inputCard');
        const errMsg = document.getElementById('errorMessage');

        // Unified focus ring on the card
        [usernameInput, passwordInput].forEach(input => {
            input.addEventListener('focus', () => inputCard.classList.add('focused'));
            input.addEventListener('blur', () => inputCard.classList.remove('focused'));
        });

        // Blue button only when username has text
        function updateButtonState() {
            if (usernameInput.value.trim()) {
                submitBtn.classList.add('active');
            } else {
                submitBtn.classList.remove('active');
            }
        }
        usernameInput.addEventListener('input', updateButtonState);

        // Form submit handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const u = usernameInput.value.trim();
            const p = passwordInput.value;
            errMsg.textContent = '';

            /* Step 1: Reveal password field with animation */
            if (step === 1) {
                if (!u) return;

                // Mark username input as "top" (square bottom corners)
                usernameInput.classList.add('top-input');

                // Reveal divider + password with slide-down animation
                dividerWrap.classList.add('show');
                // Trigger reflow so transition fires
                pwdGroup.getBoundingClientRect();
                pwdGroup.classList.add('show');

                setTimeout(() => passwordInput.focus(), 350);
                step = 2;
                return;
            }

            /* Step 2: Attempt login */
            if (step === 2 && !p) return;

            submitBtn.textContent = t('msg_verifying');
            submitBtn.classList.add('loading');
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: u, password: p, totp: '' })
                });

                const data = await res.json();

                if (data.requireTotp) {
                    // Navigate to TOTP page
                    sessionStorage.setItem('username', u);
                    sessionStorage.setItem('password', p);
                    const urlParams = new URLSearchParams(window.location.search);
                    const rd = urlParams.get('rd');
                    window.location.href = rd ? '/totp.html?rd=' + encodeURIComponent(rd) : '/totp.html';
                    return;
                }

                if (data.success) {
                    const urlParams = new URLSearchParams(window.location.search);
                    const rd = urlParams.get('rd');
                    setTimeout(() => {
                        window.location.href = (rd && rd.startsWith('http')) ? rd : '/admin';
                    }, 300);
                } else {
                    errMsg.textContent = data.message || t('msg_wrong_credentials');
                    submitBtn.textContent = t('btn_continue');
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            } catch (err) {
                errMsg.textContent = t('msg_network_error');
                submitBtn.textContent = t('btn_continue');
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
            }
        });

        // Passkey button
        document.getElementById('passkeyBtn').addEventListener('click', async () => {
            errMsg.textContent = '';
            try {
                const resp = await fetch('/api/webauthn/login-options');
                if (!resp.ok) throw new Error(t('msg_no_passkey'));
                const options = await resp.json();

                const asseResp = await startAuthentication(options);

                const verificationResp = await fetch('/api/webauthn/login-verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(asseResp)
                });

                const verificationJSON = await verificationResp.json();
                if (verificationJSON && verificationJSON.verified) {
                    const urlParams = new URLSearchParams(window.location.search);
                    const rd = urlParams.get('rd');
                    window.location.href = (rd && rd.startsWith('http')) ? rd : '/admin';
                } else {
                    errMsg.textContent = t('msg_passkey_failed');
                }
            } catch (error) {
                errMsg.textContent = error.message || t('msg_passkey_canceled');
            }
        });
    </script>
</body>
</html>
