<!DOCTYPE html>
<html lang="zh-CN" class="login-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="安全提示">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/branding/favicon.svg">
    <link rel="icon" href="/assets/branding/favicon.svg" type="image/svg+xml">
    <title>安全提示</title>
    <link rel="stylesheet" href="/css/style.css?v=96">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="/i18n.js?v=96"></script>
</head>
<body class="login-page" data-page-title-key="warning_doc_title">

    <!-- Top gray bar with nav -->
    <div class="gray-top-bar">
        <div class="nav-content">
            <img src="/assets/icons/warning.svg" width="18" height="18" alt="Alert" style="color:var(--color-warning);">
            <span class="nav-title" data-i18n="warning_nav_title">安全提示</span>
        </div>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <div class="apple-container warning-container">
            <div class="logo-container" style="margin-bottom: 20px;">
                <div class="warning-hero-icon">
                    <img src="/assets/icons/warning.svg" width="52" height="52" alt="Warning" style="color:var(--color-warning);">
                </div>
                <h1 data-i18n="warning_title" style="font-size: 21px; margin-bottom: 4px;">非受信任的重定向目标</h1>
                <p id="subtitle" data-i18n="warning_subtitle" style="font-size: 13.5px; margin-bottom: 0;">检测到外部跳转请求，已为您拦截自动重定向</p>
            </div>

            <!-- Single Unified Apple Grouped Card -->
            <div class="warning-unified-card">
                <!-- Section 1: Target URL -->
                <div class="warning-card-section">
                    <div class="warning-section-header">
                        <img src="/assets/icons/passkey.svg" width="15" height="15" alt="URL" class="user-icon">
                        <span class="warning-section-title" data-i18n="warning_target_title">目标网址</span>
                    </div>
                    <div class="warning-pill-box">
                        <div class="warning-pill-text" id="targetUrlDisplay">-</div>
                        <button type="button" class="btn-pill-copy" id="copyUrlCardBtn">
                            <img src="/assets/icons/copy.svg" width="13" height="13" alt="Copy" class="user-icon">
                            <span id="copyUrlCardBtnText" data-i18n="btn_copy">复制</span>
                        </button>
                    </div>
                    <p class="warning-hint-text" data-i18n="warning_target_desc">
                        若您已知悉潜在风险并确定继续访问，请复制上方网址并在浏览器新标签页中手动打开。
                    </p>
                </div>

                <!-- Section 2: Admin Guidance -->
                <div class="warning-card-section">
                    <div class="warning-section-header">
                        <img src="/assets/icons/user.svg" width="15" height="15" alt="Admin" class="user-icon">
                        <span class="warning-section-title" data-i18n="warning_admin_title">如何将此域名加入信任列表（管理员）</span>
                    </div>
                    <p class="warning-desc-text" data-i18n="warning_admin_desc" style="margin-bottom: 6px;">
                        如果您是站点管理员并确认该域名安全，可在服务器的 .env 文件中将其加入 TRUSTED_DOMAINS：
                    </p>
                    <div class="warning-pill-box">
                        <div class="warning-pill-text" id="envSnippetText">TRUSTED_DOMAINS=example.com,*.example.com</div>
                        <button type="button" class="btn-pill-copy" id="copySnippetBtn">
                            <img src="/assets/icons/copy.svg" width="13" height="13" alt="Copy" class="user-icon">
                            <span id="copySnippetBtnText" data-i18n="btn_copy">复制</span>
                        </button>
                    </div>
                    <p class="warning-hint-text" data-i18n="warning_admin_hint">
                        保存配置后，在服务器终端执行 sudo docker compose restart 即可即时生效。
                    </p>
                </div>
            </div>

            <!-- Action Button Row -->
            <div class="warning-action-row">
                <a href="/admin" class="warning-btn-primary" id="navDashboardBtn" data-i18n="warning_btn_go_admin">返回管理面板</a>
                <button type="button" class="warning-btn-secondary" id="copyMainActionBtn">
                    <img src="/assets/icons/copy.svg" width="16" height="16" alt="Copy" class="user-icon">
                    <span id="copyMainActionBtnText" data-i18n="warning_btn_copy_url">复制网址</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom gray bar (mobile) -->
    <div class="gray-bottom-bar"></div>

    <script src="/js/warning.js?v=94"></script>
</body>
</html>
