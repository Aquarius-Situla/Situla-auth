<!DOCTYPE html>
<html lang="zh-CN" class="login-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>双重身份验证</title>
    <style>
        /* ===== TOTP 6-box input ===== */
        .totp-boxes {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 0 auto;
        }

        .totp-digit {
            width: 46px;
            height: 52px;
            border: 1.5px solid #d2d2d7;
            border-radius: 10px;
            background: #ffffff;
            font-size: 24px;
            font-weight: 500;
            color: #1d1d1f;
            text-align: center;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
            caret-color: #0071e3;
            -moz-appearance: textfield;
        }
        .totp-digit::-webkit-outer-spin-button,
        .totp-digit::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .totp-digit:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.18);
        }
        .totp-digit.filled {
            border-color: #0071e3;
            background: #f0f6ff;
        }

        /* ===== FIDO2 waiting UI ===== */
        #fido2Section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 10px 0 4px;
        }
        .fido2-icon-wrap {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }
        .fido2-icon-wrap .fido-icon {
            width: 72px;
            height: 72px;
            background-color: #0071e3;
            -webkit-mask: url(/assets/icons/fido.svg) no-repeat center / contain;
            mask: url(/assets/icons/fido.svg) no-repeat center / contain;
        }
        @media (prefers-color-scheme: dark) {
            .fido2-icon-wrap .fido-icon {
                background-color: #0a84ff;
            }
        }
        .fido2-hint {
            font-size: 15px;
            color: #3c3c43;
            text-align: center;
            line-height: 1.5;
            max-width: 260px;
        }
        @media (prefers-color-scheme: dark) {
            .fido2-hint { color: #aeaeb2; }
        }
        .fido2-spinner {
            width: 24px;
            height: 24px;
            border: 2.5px solid #d2d2d7;
            border-top-color: #0071e3;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-color-scheme: dark) {
            .fido2-spinner { border-color: #3a3a3c; border-top-color: #0a84ff; }
        }

        @media (max-width: 400px) {
            .totp-digit {
                width: 40px;
                height: 46px;
                font-size: 20px;
                border-radius: 8px;
            }
            .totp-boxes { gap: 7px; }
        }
        @media (max-width: 500px) {
            .totp-buttons { flex-direction: column; }
            .totp-buttons #verifyBtn { order: 1; }
            .totp-buttons #backBtn  { order: 2; }
        }

        @media (prefers-color-scheme: dark) {
            .totp-digit {
                background: #1c1c1e;
                border-color: #3a3a3c;
                color: #ffffff;
            }
            .totp-digit:focus {
                border-color: #0a84ff;
                box-shadow: 0 0 0 3px rgba(10,132,255,0.22);
            }
            .totp-digit.filled {
                border-color: #0a84ff;
                background: #0d2040;
            }
            #rcInput, #fido2RcInput {
                background: #1c1c1e !important;
                border-color: #3a3a3c !important;
                color: #ffffff !important;
            }
            #rcInput:focus, #fido2RcInput:focus {
                border-color: #0a84ff !important;
                box-shadow: 0 0 0 3px rgba(10,132,255,0.22) !important;
            }
        }
    </style>
    <link rel="stylesheet" href="/css/style.css?v=81">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script src="/js/simplewebauthn.js"></script>
    <script src="/i18n.js?v=81"></script>
</head>
<body class="login-page" data-page-title-key="twofa_doc_title">

    <!-- Top gray bar with nav -->
    <div class="gray-top-bar">
        <div class="nav-content">
            <img src="/assets/icons/lock.svg" class="icon-adaptive" style="height:18px;width:auto;margin-bottom:0;" alt="">
            <span class="nav-title" data-i18n="twofa_title">双重认证</span>
        </div>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <div class="apple-container" id="twoFaContainer" style="opacity: 0; transition: opacity 0.2s ease;">

            <!-- TOTP mode (hidden by default until mode determined) -->
            <div id="totpMode" style="display:none;">
                <div class="logo-container">
                    <h1 data-i18n="twofa_title">双重认证</h1>
                </div>

                <form id="totpForm">
                    <!-- 6-box TOTP input -->
                    <div id="totpBoxSection">
                        <div class="totp-boxes" id="totpBoxes">
                            <input class="totp-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
                            <input class="totp-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
                            <input class="totp-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
                            <input class="totp-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
                            <input class="totp-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
                            <input class="totp-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
                        </div>
                    </div>

                    <!-- Recovery code input (hidden by default) -->
                    <div id="rcSection" style="display:none;">
                        <input type="text" id="rcInput"
                            style="width:100%; padding:14px; border:1.5px solid #d2d2d7; border-radius:10px;
                                   font-size:16px; text-align:center; letter-spacing:2px; outline:none;
                                   font-family:monospace; transition:border-color 0.18s, box-shadow 0.18s;"
                            data-i18n-placeholder="rc_placeholder"
                            placeholder="XXXXX-XXXXX"
                            autocomplete="off" spellcheck="false"
                        >
                    </div>

                    <p id="totpSubtitle" data-i18n="totp_subtitle_app" style="text-align:center; font-size:14px; margin-top:16px;">请输入身份验证器中显示的 6 位验证码</p>

                    <!-- Toggle link -->
                    <div style="text-align:center; margin-top:14px;">
                        <a id="toggleRcLink" href="#" style="font-size:13px; color:#0071e3; text-decoration:none;" data-i18n="totp_link_rc">
                            使用恢复码登录
                        </a>
                    </div>

                    <div id="totpError" style="color:#ff3b30; font-size:13px; text-align:center; min-height:18px; margin-top:10px;"></div>

                    <div class="button-row totp-buttons" style="margin-top:20px;">
                        <button type="button" class="login-btn back-btn" id="backBtn" data-i18n="btn_back">返回</button>
                        <button type="submit" class="login-btn btn-primary active" id="verifyBtn" data-i18n="btn_continue">继续</button>
                    </div>
                </form>
            </div>

            <!-- FIDO2 mode (hidden by default, shown when twoFaMethod === 'fido2') -->
            <div id="fido2Mode" style="display:none;">
                <div class="logo-container">
                    <div class="fido2-icon-wrap">
                        <div class="fido-icon" role="img" aria-label="FIDO2"></div>
                    </div>
                    <h1 data-i18n="fido2_title">安全密钥</h1>
                    <p id="fido2Subtitle" data-i18n="fido2_subtitle_usb">请插入并触摸你的安全密钥</p>
                </div>

                <div id="fido2KeySection">
                    <div id="fido2Section">
                        <div class="fido2-spinner" id="fido2Spinner" style="display:none;"></div>
                        <div class="fido2-hint" id="fido2StatusHint" data-i18n="fido2_prompt">请点击下方按钮开始安全密钥验证</div>
                    </div>
                </div>

                <!-- FIDO2 Recovery Code section (hidden by default) -->
                <div id="fido2RcSection" style="display:none;">
                    <input type="text" id="fido2RcInput"
                        style="width:100%; padding:14px; border:1.5px solid #d2d2d7; border-radius:10px;
                               font-size:16px; text-align:center; letter-spacing:2px; outline:none;
                               font-family:monospace; transition:border-color 0.18s, box-shadow 0.18s;"
                        data-i18n-placeholder="rc_placeholder"
                        placeholder="XXXXX-XXXXX"
                        autocomplete="off" spellcheck="false"
                    >
                </div>

                <!-- Toggle recovery code link -->
                <div style="text-align:center; margin-top:14px;">
                    <a id="toggleFido2RcLink" href="#" style="font-size:13px; color:#0071e3; text-decoration:none;" data-i18n="fido2_link_rc">
                        使用恢复码登录
                    </a>
                </div>

                <div id="fido2Error" style="color:#ff3b30; font-size:13px; text-align:center; min-height:18px; margin-top:16px;"></div>

                <div class="button-row fido2-buttons" style="margin-top:20px; justify-content:center;">
                    <button type="button" class="login-btn back-btn" id="fido2BackBtn" data-i18n="btn_back">返回</button>
                    <button type="button" class="login-btn btn-primary active" id="fido2PrimaryBtn" data-i18n="fido2_btn_start">验证安全密钥</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Bottom gray bar -->
    <div class="gray-bottom-bar"></div>

    <script src="/js/2fa.js?v=82"></script>
</body>
</html>
