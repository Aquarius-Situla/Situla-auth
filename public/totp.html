<!DOCTYPE html>
<html lang="zh-CN" class="login-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>二步验证</title>
    <style>
        /* ===== TOTP 6-box input ===== */
        .totp-boxes {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 0 auto;
        }

        .totp-digit {
            width: 46px;
            height: 52px;
            border: 1.5px solid #d2d2d7;
            border-radius: 10px;
            background: #ffffff;
            font-size: 24px;
            font-weight: 500;
            color: #1d1d1f;
            text-align: center;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
            caret-color: #0071e3;
            /* Remove spinners */
            -moz-appearance: textfield;
        }
        .totp-digit::-webkit-outer-spin-button,
        .totp-digit::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .totp-digit:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.18);
        }
        .totp-digit.filled {
            border-color: #0071e3;
            background: #f0f6ff;
        }

        @media (max-width: 400px) {
            .totp-digit {
                width: 40px;
                height: 46px;
                font-size: 20px;
                border-radius: 8px;
            }
            .totp-boxes {
                gap: 7px;
            }
        }

        /* Mobile: verify on top, back on bottom */
        @media (max-width: 500px) {
            .totp-buttons {
                flex-direction: column;
            }
            .totp-buttons #verifyBtn {
                order: 1;
            }
            .totp-buttons #backBtn {
                order: 2;
            }
        }
    </style>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    

    <script src="/js/simplewebauthn.js"></script>
    <script src="i18n.js"></script>
</head>
<body class="login-page" data-page-title-key="totp_doc_title">

    <!-- Top gray bar with nav -->
    <div class="gray-top-bar">
        <div class="nav-content">
            <!-- Apple-style thin shield icon -->
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: rgba(0,0,0,0.75);">
                <path d="M12 2L4 5.5V11c0 4.8 3.4 9.3 8 10.4C17.6 20.3 21 15.8 21 11V5.5L12 2z"/>
            </svg>
            <span class="nav-title" data-i18n="totp_title">二步验证</span>
        </div>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <div class="apple-container">
            <div class="logo-container">
                <!-- Apple-style thin shield icon (large) -->
                <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:14px;">
                    <path d="M12 2L4 5.5V11c0 4.8 3.4 9.3 8 10.4C17.6 20.3 21 15.8 21 11V5.5L12 2z"/>
                    <polyline points="9 12 11 14 15 10"/>
                </svg>
                <h1 data-i18n="totp_title">二步验证</h1>
                <p id="totpSubtitle" data-i18n="totp_subtitle_app">请输入授权应用中显示的 6 位验证码</p>
            </div>

            <form id="totpForm">
                <!-- 6-box TOTP input (default) -->
                <div id="totpBoxSection">
                    <div class="totp-boxes" id="totpBoxes">
                        <input class="totp-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
                        <input class="totp-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
                        <input class="totp-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
                        <input class="totp-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
                        <input class="totp-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
                        <input class="totp-digit" type="text" inputmode="numeric" maxlength="1" autocomplete="off">
                    </div>
                </div>

                <!-- Recovery code input (hidden by default) -->
                <div id="rcSection" style="display:none;">
                    <input type="text" id="rcInput"
                        style="width:100%; padding:14px; border:1.5px solid #d2d2d7; border-radius:10px;
                               font-size:16px; text-align:center; letter-spacing:2px; outline:none;
                               font-family:monospace; transition:border-color 0.18s, box-shadow 0.18s;"
                        data-i18n-placeholder="rc_placeholder"
                        placeholder="XXXXX-XXXXX"
                        autocomplete="off" spellcheck="false"
                    >
                </div>

                <!-- Toggle link -->
                <div style="text-align:center; margin-top:14px;">
                    <a id="toggleRcLink" href="#" style="font-size:13px; color:#0071e3; text-decoration:none;" data-i18n="totp_link_rc">
                        使用恢复码登录
                    </a>
                </div>

                <div id="totpError" style="color:#ff3b30; font-size:13px; text-align:center; min-height:18px; margin-top:10px;"></div>

                <div class="button-row totp-buttons" style="margin-top:20px;">
                    <button type="button" class="login-btn back-btn" id="backBtn" data-i18n="btn_back">返回</button>
                    <button type="submit" class="login-btn btn-primary active" id="verifyBtn" data-i18n="btn_continue">继续</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bottom gray bar -->
    <div class="gray-bottom-bar"></div>

    

    <script src="/js/totp.js"></script>
</body>
</html>
